<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wedding host desk</title><style>body{max-width:950px;margin:40px auto;padding:24px;background:#f7f4e9;color:#273e35;font:16px/1.6 system-ui}h1,h2{font-family:Georgia}label{display:block;margin:12px 0}input,button{font:inherit;padding:10px}input[type=text],input[type=password]{width:min(100%,450px);box-sizing:border-box}button{cursor:pointer;margin:6px;background:#273e35;color:white;border:0}section{border-top:1px solid #cbd1c5;padding:20px 0}article{padding:16px 0;border-bottom:1px solid #cbd1c5}a{color:inherit}output{display:block;overflow-wrap:anywhere}#status{white-space:pre-wrap}table{width:100%;text-align:left}td,th{padding:8px}main[hidden]{display:none}</style></head><body><a href="/">Invitation</a><h1>The host desk</h1><form id="login"><label>Host access key <input id="adminKey" type="password" required autocomplete="off"></label><button>Unlock</button></form><p id="status" role="status"></p><main id="desk" hidden><button id="logout">Lock desk</button><section><h2>Create a guest link</h2><form id="inviteForm"><label>Guest or family name <input name="name" type="text" required maxlength="100"></label><label>Maximum guests <input name="maxGuests" type="number" min="1" max="30" value="2" required></label><label><input name="allowStay" type="checkbox"> Ask about staying overnight</label><button>Create invitation</button></form><output id="newLink"></output></section><section><h2>Guest replies</h2><button id="refreshGuests">Refresh replies</button><div id="guests"></div></section><section><h2>Photo review</h2><p>Open each original in Drive and inspect it before approving. Approval moves it to the approved gallery folder. Rejected files stay private. This desk does not perform antivirus scanning.</p><button id="refreshPhotos">Load next 100 pending photos</button><div id="photos"></div></section></main><script type="module" src="/admin.js"></script></body></html>
